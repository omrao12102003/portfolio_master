services:
  - type: web
    name: portfolio-master-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -c "from app.research.database import get_database_url; from app.research.vector_store import ResearchVectorStore; s=ResearchVectorStore(get_database_url(), 256); s.initialize()" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
