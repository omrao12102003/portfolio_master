[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-master-backend"
version = "0.1.0"
description = "Quantitative portfolio optimization, backtesting, reinforcement learning and AI investment research platform."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
